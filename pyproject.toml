[project]
name = "arboili"
version = "0.1.0"
description = "ARBOILI — reproducible data paper on digital surveillance of arboviruses and respiratory syndromes in Brazil"
requires-python = ">=3.12"
dependencies = [
    # Core HTTP & scraping
    "requests==2.34.2",
    "beautifulsoup4==4.14.3",
    # Data processing
    "pandas==3.0.3",
    "python-dateutil==2.9.0.post0",
    # Transformation pipeline. The SINAN CSVs total ~7 GB against ~6 GB of free
    # RAM, so the pipeline needs lazy scanning with projection pushdown rather
    # than a full read. Pure Rust wheel with no Python deps, so it cannot
    # disturb the urllib3 pin above.
    "polars==1.35.1",
    # Google Trends
    "pytrends==4.9.2",
    # pytrends passes Retry(method_whitelist=...), removed in urllib3 2.x.
    # Without this pin every gt-search request fails with a TypeError.
    "urllib3<2",
    # ERA5: Zenodo (HTTP) + ARCO-ERA5 (GCS Zarr) + optional CDS last resort
    "cdsapi==0.7.6",
    "gcsfs==2025.2.0",
    "xarray==2025.1.2",
    "zarr==2.18.7",
    # Keep explicit: numcodecs 0.16+ drops blosc.cbuffer_sizes that zarr 2.x still imports.
    "numcodecs>=0.10.0,!=0.14.0,!=0.14.1,<0.16",
    "netCDF4==1.7.2",
    # Configuration
    "pyyaml==6.0.2",
    # Notebook runtime
    "ipykernel==7.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[project.optional-dependencies]
# Braço 02 (news embeddings). Deliberately an extra, not a core dependency:
# torch is ~800 MB and nothing in the other sources or braços imports it. The
# encoder itself is pinned here and its revision is pinned in config.yml, so an
# embedding computed today can be recomputed byte-for-byte later.
#   uv sync --extra embeddings
embeddings = [
    "torch==2.14.1",
    "transformers==5.19.0",
]

# Braço 03 (news topics). Also an extra rather than a core dependency: tomotopy
# is a ~30 MB C++ extension and nothing else here imports it. It carries both the
# DMR model that takes the time covariate and the LDA baseline, so the whole
# braço is one pin. Its `coherence` module is what selects k, which is why the
# choice of k is reproducible from the lock file rather than from a script.
#   uv sync --extra topics
topics = [
    "tomotopy==0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs against the full ~7 GB SINAN CSVs (deselect with '-m \"not integration\"')",
]

[project.scripts]
arboili = "src.collection.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
