# ARBOILI extraction configuration
#
# Every value here is a default for the `arboili` CLI. Command-line flags
# override the corresponding key, so this file records the canonical run
# used for the data paper while still allowing ad-hoc runs.
#
#   uv run arboili sinan                 # uses this file
#   uv run arboili sinan --to-year 2023  # overrides to_year only
#
# Relative paths are resolved against the project root (the directory
# holding this file).

# Base directory for all downloaded data. Every source path below is
# resolved relative to this unless it is itself absolute.
data_dir: data

# Shared reference tables used by more than one extractor / transform.
reference:
  federative_units: data/epidemiological/br_federative_units.csv
  popular_terms: data/google_trends/popular_terms.csv
  # IBGE mun codes + 2024 population estimates + centroids (climate pop-weights).
  municipalities: data/climate/br_municipalities.csv
  # Braço 01 lexicon. Versioned: editing a term or a weight invalidates the
  # comparison with the other news representations.
  news_lexicon: data/news/reference/lexico_dengue.yaml

sources:

  # 1 — SINAN dengue case CSVs from the Ministry of Health S3 bucket.
  sinan:
    out_dir: data/epidemiological/SINAN
    from_year: 2010
    to_year: 2026        # 2025 not yet published upstream
    keep_zip: false      # keep the downloaded .zip alongside the extracted CSV

  # 2 — Google Trends weekly search index, 5-year window, 27 UFs + BR.
  # Runtime ~5 min. Resumable via manifest_search.csv.
  gt_search:
    out_dir: data/google_trends
    reference_date: 2024-12-31   # end of the 5-year window; fixed for reproducibility
    sleep: 2.0                   # seconds between requests; raise if you hit HTTP 429

  # 3 — Google Trends related topics & queries, monthly, 27 UFs + BR.
  # ~13,400 requests ≈ 18 h at sleep=5. Resumable via manifest_related.csv.
  gt_related:
    out_dir: data/google_trends
    start_month: "2020-01"
    sleep: 5.0

  # 4 — Climate (ERA5 family). Fastest path first:
  #   zenodo → HTTP bulk ERA5-Land mun daily (1950–2022 + 2025), no key
  #   arco   → Google public ERA5 Zarr for gap years (2023–2024, …), no key
  #   cds    → Copernicus queue (last resort; needs ~/.cdsapirc)
  era5:
    out_dir: data/climate/era5
    from_year: 2014      # analysis horizon (Zenodo bulk still ships full 1950–2022 files)
    to_year: null        # null = current year
    backends: [zenodo, arco]   # add cds only if both mirrors fail
    # N, W, S, E — used by arco/cds grid extracts
    area: [5.5, -74.0, -34.0, -34.0]
    variables:
      - 2m_temperature
      - 2m_dewpoint_temperature
      - total_precipitation
      - surface_pressure
    # CDS-only knobs (ignored unless backends includes cds)
    dataset: reanalysis-era5-land
    grid: [0.25, 0.25]
    delay: 1.0

  # 4b — INMET annual station ZIPs (optional; kept for station-level work).
  # Not included in `arboili all` — prefer era5 for UF×EW features.
  inmet:
    out_dir: data/climate/inmet
    from_year: 2000
    to_year: null

  # 5 — Ministry of Health epidemiological bulletin PDFs.
  bulletins:
    out_dir: data/bulletins
    from_year: 2019
    to_year: null        # null = current year

  # 6 — EBC / Agência Brasil news articles.
  # `queries` drives one scrape per entry; each writes to <out_dir>/<name>.
  ebc:
    out_dir: data/news
    site: agenciabrasil
    types: [noticia, pagina]
    per_page: 100
    max_pages: 10000
    delay: 1.0
    queries:
      - name: dengue
        query: dengue

# Transformation stages, run after collection with `arboili transform <stage>`.
pipeline:

  # SINAN case-level CSVs -> weekly case series by epi week, state and
  # final classification. Case counts only; no symptom columns.
  sinan:
    in_dir: data/epidemiological/SINAN
    out_dir: data/epidemiological/SINAN
    disease: dengue        # dengue | chikungunya (no chikungunya files yet)
    from_year: null        # null = every DENGBR*.csv found
    to_year: null
    # Kept records satisfy dif_lower < (symptom onset - notification) < dif_upper,
    # in days. Both bounds strict, matching the R pipeline these defaults
    # reproduce: the lower bound drops data-entry errors (a birth date typed into
    # the onset field), the upper bound drops onsets recorded after their own
    # notification. The article's prose describes only the 180-day rule.
    dif_lower: -180
    dif_upper: 1
    formats: [parquet, csv_gz]   # parquet is primary; csv.gz is for R

  # ERA5 Zenodo (mun daily) + ARCO (0.25° gaps) → UF × epi-week physical features.
  # Population-weighted means; rainy-day threshold from the dengue-climate literature.
  climate:
    era5_dir: data/climate/era5
    out_dir: data/climate/era5
    from_year: 2014             # null = every year present in the downloaded products
    to_year: null
    backends: [zenodo, arco]    # CDS transform path deferred
    rainy_day_mm: 0.03
    formats: [parquet, csv_gz]

  # Google Trends weekly search index — thin rename/validate.
  gtrends:
    input_path: data/google_trends/GoogleTrends_search.csv
    out_dir: data/google_trends
    keep_br: true               # keep national BR rows alongside the 27 UFs
    formats: [parquet, csv_gz]

  # Google Trends related topics/queries — monthly grain (partial extracts OK).
  gt_related:
    topics_path: data/google_trends/GoogleTrends_related_topic.csv
    queries_path: data/google_trends/GoogleTrends_related_query.csv
    out_dir: data/google_trends
    keep_br: true
    drop_empty_related: true    # drop placeholder rows with blank related_title
    formats: [parquet, csv_gz]

  # EBC article HTML → the frozen news-text corpus every representation reads.
  # `in_dir` is the query directory written by `arboili ebc`, so it must hold
  # articles/ and manifest.jsonl. Nothing downstream re-parses HTML.
  news_text:
    in_dir: data/news/dengue
    out_dir: data/pipeline/news
    formats: [parquet, csv_gz]

  # Braço 01 — PT-BR lexicon + rules over the frozen corpus.
  # See src/pipeline/news/README.md §2 and notes/01-lexico-regras.md.
  news_lexicon:
    corpus_path: data/pipeline/news/EBC_dengue_text.parquet
    lexicon: data/news/reference/lexico_dengue.yaml
    out_dir: data/pipeline/news
    # Drop articles that never name a dengue-family disease (errata pages,
    # photo-agenda stubs, digests whose dengue link is incidental).
    require_disease_term: true
    # Drop the ~3.8% of the corpus that is Spanish. Agência Brasil publishes a
    # Spanish edition and the split is not random — 61 of the 172 are from 2016.
    portuguese_only: true
    formats: [parquet, csv_gz]

  # Braço 02 — dense BERTimbau embeddings, pooled by (epi week, location).
  # The encoder is frozen (no fine-tuning) and its *revision* is pinned, not just
  # its name: a branch would move under the artifact and make yesterday's
  # embedding unreproducible. See src/pipeline/news/README.md §3 and
  # notes/02-embeddings-densos.md.
  #   uv sync --extra embeddings      # torch + transformers
  news_embeddings:
    corpus_path: data/pipeline/news/EBC_dengue_text.parquet
    lexicon: data/news/reference/lexico_dengue.yaml
    out_dir: data/pipeline/news
    model_name: neuralmind/bert-base-portuguese-cased
    model_revision: 94d69c95f98f7d5b2a8700c420230ae10def0baa
    batch_size: 16
    # Same gates as braço 01 — protocol 00 fixes the article set as common
    # ground, so the comparison isolates the representation, not the filter.
    require_disease_term: true
    portuguese_only: true
    # L2-normalize each article vector so a week's mean is a centroid on the unit
    # sphere and emb_std reads as angular spread. Changing it changes the numbers.
    normalize: true
    formats: [parquet]          # a 768-float column does not survive csv text form

  # Braço 03 — temporal topic modeling, pooled by (epi week, location).
  # One model per run, fit over the whole corpus with the *period* as a covariate
  # (tomotopy's DMR — the mechanism STM extends), then each week's articles are
  # averaged into a topic mixture. `family: lda` drops the covariate and produces
  # the baseline; run it with a different `out_dir` if you want to keep both.
  # See src/pipeline/news/README.md §4 and notes/03-topic-modeling.md.
  #   uv sync --extra topics          # tomotopy
  news_topics:
    corpus_path: data/pipeline/news/EBC_dengue_text.parquet
    lexicon: data/news/reference/lexico_dengue.yaml
    out_dir: data/pipeline/news
    # The number of topics is *selected*, not configured: every candidate below is
    # fitted, scored by coherence (never perplexity — see the spec), and the most
    # coherent wins. Ties go to the smaller k. The whole sweep is written to
    # EBC_dengue_topics_sweep so the choice can be checked rather than trusted.
    k_range: [5, 10, 15, 20, 25]
    coherence_metric: c_v
    # The period the covariate is binned into. `month`, not the weekly grain the
    # tables are keyed by: 965 weekly levels against ~4.5 articles each would
    # over-parameterise the fit, while ~290 monthly levels get ~15.
    grain: month
    family: dmr
    seed: 42                     # needs workers=1 to actually fix the fit
    iterations: 1000
    min_df: 3                    # a term must appear in >= 3 documents
    top_terms: 15                # terms published per topic in the meta table
    # Same gates as braços 01 and 02 — protocol 00 fixes the article set as common
    # ground, so the comparison isolates the representation, not the filter.
    require_disease_term: true
    portuguese_only: true
    formats: [parquet, csv_gz]   # both tables are long and narrow, unlike braço 02
